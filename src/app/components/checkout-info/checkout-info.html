<button class="info-link" type="button" (click)="dialog.showModal()">
  {{ label() ?? content[topic()].label }}
</button>
<dialog #dialog class="info-dialog" [attr.aria-label]="content[topic()].title">
  <h2>{{ content[topic()].title }}</h2>
  <p>{{ content[topic()].text }}</p>
  <button class="primary-button" type="button" autofocus (click)="dialog.close()">Entendi</button>
</dialog>
