<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); mainContent.focus()"
  >Pular para o conteúdo</a
>
<div class="checkout-layout">
  <header class="site-header">
    <div class="header-content">
      <a class="brand" routerLink="/pagamento" aria-label="Nexo, página de pagamento"
        ><app-icon name="brand" />nexo</a
      >
      <span class="secure-label"><app-icon name="lock" />Checkout seguro</span>
    </div>
  </header>
  <main #mainContent id="main-content" tabindex="-1">
    <ol class="checkout-steps" aria-label="Etapas do checkout">
      <li class="completed">
        <span class="step-number"><app-icon name="check" /></span>Pedido<span class="sr-only">
          concluído</span
        >
      </li>
      <li
        [class.completed]="store.hasSuccessfulPayment()"
        [class.active]="!store.hasSuccessfulPayment()"
        [attr.aria-current]="!store.hasSuccessfulPayment() ? 'step' : null"
      >
        <span class="step-number">
          @if (store.hasSuccessfulPayment()) {
            <app-icon name="check" />
          } @else {
            2
          }</span
        >Pagamento
      </li>
      <li
        [class.completed]="store.hasSuccessfulPayment()"
        [attr.aria-current]="store.hasSuccessfulPayment() ? 'step' : null"
      >
        <span class="step-number">
          @if (store.hasSuccessfulPayment()) {
            <app-icon name="check" />
          } @else {
            3
          }</span
        >Confirmação
      </li>
    </ol>
    <router-outlet />
  </main>
  <footer class="site-footer">
    <p>© 2026 Nexo. Todos os direitos reservados.</p>
    <nav aria-label="Informações">
      <app-checkout-info topic="help" /><app-checkout-info topic="privacy" /><app-checkout-info
        topic="terms"
      />
    </nav>
  </footer>
</div>
